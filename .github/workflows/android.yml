name: Build Android APK

on:
  pull_request:
  push:
    branches:
      - main
      - agent/daily-load-app

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ "$GEMINI_API_KEY" = "MY_GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing or still set to the placeholder."
            exit 1
          fi
      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jenkins-Daily-OCR-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
